<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b2a5b" />
<title>Conferma email · Orario Docente</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#eef5ff,#fff);color:#10233f}.card{width:min(480px,100%);background:#fff;border:1px solid #dae5f0;border-radius:28px;box-shadow:0 25px 70px rgba(31,56,88,.16);padding:28px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:50px;height:50px;border-radius:16px;background:#0b2a5b;color:#fff;display:grid;place-items:center;font-size:26px}.brand strong{display:block;font-size:20px}.brand span{color:#607089}.spinner{width:25px;height:25px;border:3px solid #dce6f1;border-top-color:#0b2a5b;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}.spinner.hidden{display:none}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:30px;margin:0 0 10px}.success{color:#137333}.error{color:#9a1c1c}p{color:#607089;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-block;text-decoration:none;border:1px solid #dbe5f0;border-radius:12px;padding:11px 14px;font-weight:750;color:#0b2a5b;background:#fff}.primary{background:#0b2a5b;color:#fff}.build{position:fixed;right:8px;bottom:8px;background:#10233f;color:#fff;border-radius:8px;padding:5px 8px;font-size:11px;font-weight:800;opacity:.82}
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="brand"><div class="mark">📅</div><div><strong>ORARIO DOCENTE</strong><span>Conferma dell’account</span></div></div>
  <div class="spinner" aria-hidden="true"></div>
  <h1 id="confirmationStatus">Conferma in corso…</h1>
  <p id="confirmationDetail">Attendi qualche secondo senza chiudere questa pagina.</p>
  <div id="confirmationActions" class="actions" hidden>
    <a class="btn primary" href="/">Vai all’accesso</a>
    <a class="btn" href="mailto:assistenza@orariodocente.it">Contatta assistenza</a>
  </div>
</main>
<div class="build">PR #15 · v16.10.26</div>
<script type="module" src="/identity-confirmation-client.js?v=16.10.26"></script>
</body>
</html>
