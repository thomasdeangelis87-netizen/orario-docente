<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amministrazione · Orario Docente</title><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><style>body{font-family:Inter,system-ui;background:#f4f8fc;color:#10233f;margin:0}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe7f0;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(20,50,80,.08)}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field input{padding:11px;border:1px solid #cbd7e4;border-radius:10px}.btn{padding:11px 14px;border-radius:12px;border:1px solid #dbe5f0;background:#fff;font-weight:800;cursor:pointer}.primary{background:#0b2a5b;color:#fff}.note{padding:12px;border-radius:12px;background:#fff4d6}.ok{background:#e6f6ea}.row{display:flex;gap:8px;flex-wrap:wrap}a{color:#0b2a5b}</style></head><body><div class="wrap"><p><a href="/">← Orario Docente</a></p><div class="card"><h1>Attiva una scuola</h1><p class="note">Questa pagina serve all'amministrazione della piattaforma dopo aver verificato una richiesta ricevuta dal Portale Scuole.</p><button class="btn" id="loginBtn">Accedi</button><div class="field"><label>Chiave amministratore piattaforma</label><input id="adminKey" type="password" autocomplete="off"></div><div class="field"><label>Denominazione scuola *</label><input id="name"></div><div class="field"><label>Codice meccanografico *</label><input id="mechanical"></div><div class="row"><div class="field" style="flex:1"><label>Comune</label><input id="city"></div><div class="field" style="width:120px"><label>Provincia</label><input id="province" maxlength="2"></div></div><div class="field"><label>Email account del primo amministratore scuola *</label><input id="adminEmail" type="email"></div><div class="field"><label>Nome amministratore</label><input id="adminName"></div><button class="btn primary" id="createBtn">Attiva scuola e genera codice</button><div id="msg" style="margin-top:14px"></div></div></div><script>let user=null;async function api(){if(!user)throw new Error('Prima accedi');const token=await user.jwt();const r=await fetch('/.netlify/functions/admin-school',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json','X-Platform-Admin-Key':adminKey.value},body:JSON.stringify({name:name.value,mechanicalCode:mechanical.value,city:city.value,province:province.value,adminEmail:adminEmail.value,adminName:adminName.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Errore');return d}loginBtn.onclick=()=>netlifyIdentity.open('login');createBtn.onclick=async()=>{msg.textContent='Attivazione…';try{const d=await api();msg.className='note ok';msg.innerHTML=`✅ Scuola attivata.<br><strong>Codice scuola: ${d.school.code}</strong><br>Amministratore: ${d.membership.email}`;}catch(e){msg.className='note';msg.textContent='⚠️ '+e.message}};if(window.netlifyIdentity){netlifyIdentity.on('init',u=>{user=u});netlifyIdentity.on('login',u=>{user=u;netlifyIdentity.close()});netlifyIdentity.init()}</script></body></html>
