<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amministrazione · Orario Docente</title><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><style>body{font-family:Inter,system-ui;background:#f4f8fc;color:#10233f;margin:0}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe7f0;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(20,50,80,.08)}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field input{padding:11px;border:1px solid #cbd7e4;border-radius:10px}.btn{padding:11px 14px;border-radius:12px;border:1px solid #dbe5f0;background:#fff;font-weight:800;cursor:pointer}.primary{background:#0b2a5b;color:#fff}.note{padding:12px;border-radius:12px;background:#fff4d6}.ok{background:#e6f6ea}.row{display:flex;gap:8px;flex-wrap:wrap}a{color:#0b2a5b}</style></head><body><div class="wrap"><p><a href="/">← Orario Docente</a></p><div class="card"><h1>Attiva una scuola</h1><p class="note">Questa pagina serve all'amministrazione della piattaforma dopo aver verificato una richiesta ricevuta dal Portale Scuole.</p><button class="btn" id="loginBtn">Accedi</button><div class="field"><label>Chiave amministratore piattaforma</label><input id="adminKey" type="password" autocomplete="off"></div><div class="field"><label>Denominazione scuola *</label><input id="name"></div><div class="field"><label>Codice meccanografico *</label><input id="mechanical"></div><div class="row"><div class="field" style="flex:1"><label>Comune</label><input id="city"></div><div class="field" style="width:120px"><label>Provincia</label><input id="province" maxlength="2"></div></div><div class="field"><label>Email account del primo amministratore scuola *</label><input id="adminEmail" type="email"></div><div class="field"><label>Nome amministratore</label><input id="adminName"></div><button class="btn primary" id="createBtn">Attiva scuola e genera codice</button><div id="msg" style="margin-top:14px"></div></div></div><script>
let user=null;
const $=id=>document.getElementById(id);

async function api(){
  if(!user) throw new Error('Prima accedi con il tuo account Orario Docente.');
  const token=await user.jwt();
  const payload={
    name:$('name').value.trim(),
    mechanicalCode:$('mechanical').value.trim(),
    city:$('city').value.trim(),
    province:$('province').value.trim(),
    adminEmail:$('adminEmail').value.trim(),
    adminName:$('adminName').value.trim()
  };
  const key=$('adminKey').value.trim();
  if(!key) throw new Error('Inserisci la chiave amministratore piattaforma.');
  if(!payload.name || !payload.mechanicalCode || !payload.adminEmail)
    throw new Error('Compila denominazione scuola, codice meccanografico ed email amministratore.');

  let r;
  try{
    r=await fetch('/.netlify/functions/admin-school',{
      method:'POST',
      headers:{
        'Authorization':'Bearer '+token,
        'Content-Type':'application/json',
        'X-Platform-Admin-Key':key
      },
      body:JSON.stringify(payload)
    });
  }catch(err){
    throw new Error('Impossibile contattare il backend: '+(err?.message||String(err)));
  }

  const raw=await r.text();
  let d={};
  try{ d=raw ? JSON.parse(raw) : {}; }catch(_){ d={}; }

  if(!r.ok){
    const detail=[d.error,d.detail].filter(Boolean).join(' — ') || raw || `Errore HTTP ${r.status}`;
    throw new Error(detail);
  }
  if(!d.school?.code) throw new Error('Risposta del server valida ma senza codice scuola.');
  return d;
}

$('loginBtn').onclick=()=>netlifyIdentity.open('login');
$('createBtn').onclick=async()=>{
  const m=$('msg');
  m.className='note';
  m.textContent='Attivazione…';
  try{
    const d=await api();
    m.className='note ok';
    m.innerHTML=`✅ Scuola attivata.<br><strong>Codice scuola: ${d.school.code}</strong><br>Amministratore: ${d.membership.email}`;
  }catch(e){
    console.error('Attivazione scuola:',e);
    m.className='note';
    m.textContent='⚠️ '+(e?.message || String(e) || 'Errore sconosciuto');
  }
};

if(window.netlifyIdentity){
  netlifyIdentity.on('init',u=>{
    user=u;
    $('loginBtn').textContent=u ? `Connesso: ${u.email}` : 'Accedi';
  });
  netlifyIdentity.on('login',u=>{
    user=u;
    $('loginBtn').textContent=`Connesso: ${u.email}`;
    netlifyIdentity.close();
  });
  netlifyIdentity.on('logout',()=>{
    user=null;
    $('loginBtn').textContent='Accedi';
  });
  netlifyIdentity.init();
}
</script></body></html>
