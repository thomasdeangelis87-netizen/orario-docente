[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # @netlify/identity 2.x requires Node >=22.12. Without an explicit runtime
  # Netlify can build the Functions for an older Node version and they abort
  # before the handler (and before our diagnostic logging) is entered.
  NODE_VERSION = "22.12.0"

[functions]
  node_bundler = "esbuild"
